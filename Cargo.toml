[package]
name = "test-musicore-webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "http2"] }
bincode = "3.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "series"] }
rust-yt-downloader = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
ytmusicapi = "0.5.0"
